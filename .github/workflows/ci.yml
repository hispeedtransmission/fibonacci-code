name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.10 is the floor declared in package.json — test the floor, not just
        # the latest, or `engines` becomes a claim nobody has verified.
        node: ['20.10', '22', '24']
        os: [ubuntu-latest]
        include:
          - node: '22'
            os: macos-latest
          - node: '22'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The test runner needs --experimental-strip-types (Node >=22.6). The
      # SHIPPED code is plain JS and runs on the >=20.10 in `engines`, which the
      # build and smoke steps below verify on that exact floor.
      - name: Test
        if: matrix.node != '20.10'
        run: npm test

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

          # With no credentials anywhere, the CLI must fail with a non-zero exit
          # and an actionable message — not a stack trace, and not success.
          # `|| true` keeps `set -e` from treating the expected failure as fatal.
          out=$(FIBONACCI_HOME="$(mktemp -d)" CODEX_HOME="$(mktemp -d)" \
                node dist/cli.js "hello" 2>&1) && rc=0 || rc=$?

          echo "exit=$rc"
          echo "$out"
          test "$rc" -ne 0 || { echo "::error::expected a non-zero exit with no credentials"; exit 1; }
          grep -qiE 'codex|auth|api key' <<< "$out" \
            || { echo "::error::error message is not actionable"; exit 1; }
          grep -qiE 'at .*\(.*:[0-9]+:[0-9]+\)' <<< "$out" \
            && { echo "::error::leaked a stack trace to the user"; exit 1; } || true
          echo "unauthenticated path: exits $rc with an actionable message"

  version-lockstep:
    name: version lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json, src/version.ts and pyproject.toml must agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          src=$(grep -oE "VERSION = '[^']+'" src/version.ts | cut -d"'" -f2)
          py=$(grep -oE '^version = "[^"]+"' python/pyproject.toml | cut -d'"' -f2)
          echo "package.json=$pkg  src/version.ts=$src  pyproject=$py"
          test "$pkg" = "$src" || { echo "::error::package.json ($pkg) != src/version.ts ($src)"; exit 1; }
          test "$pkg" = "$py"  || { echo "::error::package.json ($pkg) != pyproject.toml ($py)"; exit 1; }

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/

      - name: Test
        run: pytest -q

      - name: Import and CLI smoke test
        run: |
          python -c "import fibonacci; print(fibonacci.__version__)"
          fib --version
          fib --help > /dev/null

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: npm pack contains a runnable CLI and no junk
        run: |
          npm pack --silent
          tar tzf fibonacci-code-*.tgz | sort > /tmp/files.txt
          cat /tmp/files.txt
          grep -q 'package/dist/cli.js' /tmp/files.txt
          grep -q 'package/README.md'   /tmp/files.txt
          grep -q 'package/LICENSE'     /tmp/files.txt
          # Credentials, tests and sources must never ship.
          ! grep -qE 'package/(test/|src/|\.github/|auth\.json|\.env)' /tmp/files.txt

      # Assert on OUTPUT, not just the exit code. A silent success is exactly
      # how the symlinked-bin bug shipped once: `npm install -g` symlinks
      # bin/fib at dist/cli.js, so argv[1] is the symlink while import.meta.url
      # is the target. The entry-point guard compared them literally, decided
      # it was being imported rather than run, and exited 0 having printed
      # nothing. `fib --version` "passed".
      - name: Installed package actually runs
        run: |
          set -euo pipefail
          npm install -g ./fibonacci-code-*.tgz

          for bin in fib fibonacci; do
            got=$("$bin" --version)
            echo "$bin --version -> '$got'"
            test -n "$got" || { echo "::error::$bin produced NO output — entry point did not execute"; exit 1; }
            echo "$got" | grep -qE '^fibonacci [0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::$bin printed an unexpected version string: $got"; exit 1; }
          done

          help=$(fib --help)
          test -n "$help" || { echo "::error::fib --help produced no output"; exit 1; }
          echo "$help" | grep -q 'USAGE' || { echo "::error::help text missing USAGE"; exit 1; }

          # The symlink must be followed correctly regardless of how it is
          # reached, including through an extra indirection.
          ln -s "$(command -v fib)" /tmp/fib-via-second-symlink
          got=$(/tmp/fib-via-second-symlink --version)
          test -n "$got" || { echo "::error::chained symlink produced no output"; exit 1; }
          echo "chained symlink -> '$got'"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python distributions build cleanly
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
