<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Fibonacci — a coding-agent instrument</title>
  <desc id="desc">A white modular Fibonacci F with an orange verification cell on a phthalo-green field.</desc>
  <rect width="1200" height="340" fill="#034F3B"/>
  <path d="M0 286H1200V340H0Z" fill="#10120F"/>
  <path d="M0 0H1200V8H0Z" fill="#FF4F1F"/>

  <!-- Mosaic F: square cells and diagonal terminal cuts. -->
  <g transform="translate(66 49) scale(.8)" fill="#E8DFCA">
    <path d="M20 20H68V68H4V44Z"/>
    <rect x="72" y="20" width="48" height="48"/>
    <rect x="124" y="20" width="48" height="48"/>
    <path d="M176 20H220L244 44V68H176Z"/>
    <rect x="4" y="72" width="48" height="48"/>
    <rect x="56" y="72" width="48" height="48"/>
    <path d="M108 72H156L180 96L156 120H108Z"/>
    <rect x="4" y="124" width="48" height="48"/>
    <rect x="4" y="176" width="48" height="48" fill="#FF4F1F"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="354" y="130" font-size="78" font-weight="800" fill="#E8DFCA" letter-spacing="-4">FIBONACCI</text>
    <text x="359" y="178" font-size="23" font-weight="600" fill="#B8E0CA" letter-spacing="1">CODING-AGENT INSTRUMENT</text>
    <path d="M359 210H1128" stroke="#E8DFCA" stroke-opacity=".28"/>
    <text x="359" y="248" font-size="19" fill="#E8DFCA">01 · 01 · 02 · 03 · 05 · 08 · 13</text>
    <text x="68" y="320" font-size="15" fill="#B8E0CA" letter-spacing=".8">PROOF COMPOUNDS.</text>
    <text x="963" y="320" font-size="15" fill="#E8DFCA">fibonacci-code</text>
  </g>
</svg>
