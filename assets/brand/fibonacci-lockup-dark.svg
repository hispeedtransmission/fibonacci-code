<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Dark Fibonacci compass and spray-enamel lockup</title>
  <desc id="desc">A luminous compass-drawn spiral and sparkling all-caps serif wordmark on carbon.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@144,900,0,1&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');</style>
  <defs>
    <pattern id="spark" width="39" height="33" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r="1.1" fill="#0C9B72"/><circle cx="13" cy="3" r=".65" fill="#D1C6AD"/><circle cx="20" cy="16" r=".9" fill="#B8E0CA"/><circle cx="34" cy="9" r=".7" fill="#D1C6AD"/><circle cx="36" cy="28" r="1.2" fill="#0C9B72"/><circle cx="8" cy="29" r=".65" fill="#B8E0CA"/></pattern>
    <filter id="enamel" x="-4%" y="-15%" width="108%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".011 .19" numOctaves="2" seed="13" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".75"/></filter>
    <mask id="spray"><rect width="1600" height="440" fill="#000"/><text x="430" y="303" fill="#fff" stroke="#fff" stroke-width="15" opacity=".85" font-family="Fraunces, Georgia, serif" font-size="190" font-weight="900" letter-spacing="-8">FIBONACCI</text></mask>
  </defs>
  <rect width="1600" height="440" fill="#171914"/><path d="M0 40H1600M0 400H1600M399 40V400" stroke="#D1C6AD" stroke-width="2" opacity=".76"/>
  <g transform="translate(20 4) scale(.70)">
    <g transform="rotate(128 256 256)" fill="none" stroke="#D1C6AD" stroke-width="1.2" opacity=".44"><circle cx="258" cy="256" r="4"/><circle cx="256" cy="256" r="6"/><circle cx="256" cy="252" r="10"/><circle cx="262" cy="252" r="16"/><circle cx="262" cy="262" r="26"/><circle cx="246" cy="262" r="42"/><circle cx="246" cy="236" r="68"/><circle cx="288" cy="236" r="110"/><circle cx="288" cy="304" r="178"/></g>
    <g transform="rotate(128 256 256)" fill="none" stroke-linecap="square"><path d="M258 252 A4 4 0 0 1 262 256 A6 6 0 0 1 256 262 A10 10 0 0 1 246 252 A16 16 0 0 1 262 236 A26 26 0 0 1 288 262 A42 42 0 0 1 246 304 A68 68 0 0 1 178 236 A110 110 0 0 1 288 126 A178 178 0 0 1 466 304" stroke="#022D23" stroke-width="10"/><path d="M258 252 A4 4 0 0 1 262 256 A6 6 0 0 1 256 262 A10 10 0 0 1 246 252 A16 16 0 0 1 262 236 A26 26 0 0 1 288 262 A42 42 0 0 1 246 304 A68 68 0 0 1 178 236 A110 110 0 0 1 288 126 A178 178 0 0 1 466 304" stroke="#0C9B72" stroke-width="5.8"/></g>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="19" font-weight="500" fill="#D1C6AD" letter-spacing="4"><text x="430" y="86">RUST × TYPESCRIPT</text><text x="430" y="116">CODING AGENT HARNESS</text></g>
  <rect x="405" y="135" width="1170" height="210" fill="url(#spark)" mask="url(#spray)" opacity=".82"/>
  <text x="430" y="303" fill="#066A4F" font-family="Fraunces, Georgia, serif" font-size="190" font-weight="900" letter-spacing="-8" filter="url(#enamel)">FIBONACCI</text>
  <text x="430" y="303" fill="url(#spark)" font-family="Fraunces, Georgia, serif" font-size="190" font-weight="900" letter-spacing="-8" opacity=".9">FIBONACCI</text>
