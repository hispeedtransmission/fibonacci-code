<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 38 25" width="380" height="250" role="img" aria-label="Fibonacci">
  <title>Fibonacci</title>
  <!--
    Not a decorative swirl: eight quarter-circle arcs of radius 1,1,2,3,5,8,13,21
    chained through the squares that tile a 34x21 rectangle. 34/21 = 1.6190,
    against phi = 1.6180. The mark is the sequence.
  -->
  <defs>
    <linearGradient id="fibGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97B29"/>
      <stop offset="55%" stop-color="#E9A23B"/>
      <stop offset="100%" stop-color="#F5C46B"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#E9A23B" stroke-opacity="0.16" stroke-width="0.12">
    <rect x="0"  y="0"  width="21" height="21"/>
    <rect x="21" y="0"  width="13" height="13"/>
    <rect x="26" y="13" width="8"  height="8"/>
    <rect x="21" y="16" width="5"  height="5"/>
    <rect x="21" y="13" width="3"  height="3"/>
    <rect x="24" y="13" width="2"  height="2"/>
    <rect x="24" y="15" width="1"  height="1"/>
    <rect x="25" y="15" width="1"  height="1"/>
  </g>

  <path
    d="M 25 16 A 1 1 0 0 1 26 15 A 2 2 0 0 1 24 13 A 3 3 0 0 1 21 16 A 5 5 0 0 1 26 21 A 8 8 0 0 1 34 13 A 13 13 0 0 1 21 0 A 21 21 0 0 1 0 21"
    fill="none" stroke="url(#fibGold)" stroke-width="1.05"
    stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="25" cy="16" r="0.62" fill="#F5C46B"/>
</svg>
